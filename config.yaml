video: data/raw/fulltrack_clip_1.mp4
model: models/stumpbest.pt
fps: 60
size: [720, 1280]            # width, height of the video
frames: [0, 140]            # frames range to analyze
ball_csv: data/labels/ball.csv
ball_frame_offset: 0
stump_conf: 0.15

# FullTrack setup (soft priors): camera 4 m behind bowler's stumps, 1.3 m high
camera_prior:
  mu: [0.0, -4.0, 1.3]
  sigma: [0.30, 0.30, 0.15]   # metres; widen if you suspect a different setup
  weight: 1.0

# Optional extra ground-truth points: world (x,y,z) in metres -> pixel (u,v).
extra_points: []

ground_truth:               # from FullTrack stats screenshot
  speed_mph: 52.0
  swing_sf: 0.2
  spin_deg: 3.6
